<!DOCTYPE html>
<!--
Karma execution context for Compose Multiplatform UI tests on the Kotlin/JS target.
Loads the skiko wasm runtime and starts Karma only after it is ready.
Based on: https://github.com/JetBrains/compose-multiplatform-core/blob/jb-main/mpp/karma.config.d/js/static/compose_context.html
-->
<html>
<head>
  <title></title>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <style>
    body { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; }

    canvas {
      outline: 0
    }
  </style>
</head>
<body>
  <script src="context.js"></script>
  <script type="text/javascript">
    %CLIENT_CONFIG%
    window.__karma__.setupContext(window);
    %MAPPINGS%
  </script>
  %SCRIPTS%
  <script type="module">
    import {api} from "/base/kotlin/js-skiko-reexport-symbols.mjs"

    api.awaitSkiko.then(() => {
              window.__karma__.start();
            })
            .catch(error => {
              console.error('Failed to load skiko wasm module:', error);
              window.__karma__.error(error);
            });
  </script>
</body>
</html>
